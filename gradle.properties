org.gradle.jvmargs=-Xmx3G
org.gradle.caching=true

mod_id=dregorapatches
mod_name=Dregora Patches
mod_version=0.4.1

# MCP mappings for 1.12.2
mapping_channel=stable
mapping_version=39

# Compile-only. MixinBooter is used ONLY for the Mixin annotations + annotation
# processor (refmap generation). It is NOT shipped and NOT needed at runtime:
# FermiumBooter provides Mixin on the production server.
mixin_ap_artifact=zone.rong:mixinbooter:11.18

# MixinExtras: the version FermiumBooter 1.4.1 bundles. Compile-only.
mixinextras_version=0.5.0

# FermiumBooter 1.4.1 on CurseForge (project 968474). Compile-only.
fermium_project_id=968474
fermium_file_id=7279112

# NuclearCraft on CurseForge (project 226254). Compile-only, deobfuscated by RFG.
# 6151363 = nuclearcraft-1.12.2-2.19a.jar, the version the server and clients run
# (9469401 = 2.19d). The server stays on 2.19a: NC has no acceptableRemoteVersions,
# so a server update would force every client to update. The classes we patch are
# identical in 2.19a and 2.19d (docs/07), so the mixins cover both.
nc_project_id=226254
nc_file_id=6151363

# Level Up! 2 ("Level Up! Reloaded") on CurseForge (project 251136). Compile-only,
# deobfuscated by RFG. 2763516 = Level Up! 2-1.1.23-1.12.jar, sha1 e41da792...,
# identical to the server's jar. Clear the file id to use a jar in libs/ instead.
levelup2_project_id=251136
levelup2_file_id=2763516

# Lycanites Mobs on CurseForge (project 224770). Compile-only, deobfuscated by RFG.
# 5750564 = lycanitesmobs-1.12.2-2.0.8.10.jar (the pack's version), sha1 56c49cf0...
lycanites_project_id=224770
lycanites_file_id=5750564
