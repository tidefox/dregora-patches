plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.3'
}

version = project.mod_version
group = 'io.github.tidefox.warband'

base {
    archivesName.set(project.mod_id)
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
    }
}

minecraft {
    mcVersion.set('1.12.2')
    mcpMappingChannel.set(project.mapping_channel)
    mcpMappingVersion.set(project.mapping_version)
    username.set('Developer')
    injectedTags.put('VERSION', project.version.toString())
    injectedTags.put('MOD_ID', project.mod_id)
    injectedTags.put('MOD_NAME', project.mod_name)
}

tasks.named('injectTags').configure {
    outputClassName.set('io.github.tidefox.warband.Tags')
}

repositories {
    mavenCentral()
}

dependencies {
    // Warband is a plain Forge mod: no mixins, no other mods on the classpath (CLAUDE.md rule 3).
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('mcmod.info') {
        expand('version': project.version, 'mod_id': project.mod_id, 'mod_name': project.mod_name)
    }
}

jar {
    manifest {
        attributes(
            'Implementation-Title': project.mod_name,
            'Implementation-Version': project.version
        )
    }
}
