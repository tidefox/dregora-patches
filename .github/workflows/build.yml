name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORGE_VERSION: 1.12.2-14.23.5.2860
  FERMIUM_VERSION: 1.4.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Java 8 is the compile/test toolchain; Gradle itself runs on 25, which
      # RetroFuturaGradle 2.x requires (last one listed = JAVA_HOME).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            25

      # Caches ~/.gradle, which includes RetroFuturaGradle's decompiled Minecraft/Forge and assets.
      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test dregorapatches
        working-directory: dregorapatches
        run: ./gradlew build --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64

      - name: Build and test warband
        working-directory: warband
        run: ./gradlew build --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64

      - name: Pick and check release jars
        run: |
          set -euo pipefail
          mkdir -p dist
          pick() { ls "$1"/build/libs/"$1"-*.jar | grep -vE -- '-(dev|sources|javadoc)\.jar$' | head -1; }
          dp=$(pick dregorapatches); wb=$(pick warband)
          [ -n "$dp" ] && [ -n "$wb" ] || { echo "::error::release jar missing"; exit 1; }
          cp "$dp" "$wb" dist/

          # Listings are captured first: "unzip | grep -q" fails under pipefail when grep exits early (SIGPIPE).
          dpl=$(unzip -l "$dp"); wbl=$(unzip -l "$wb"); dpm=$(unzip -p "$dp" META-INF/MANIFEST.MF | tr -d '\r\n ')
          echo "--- dregorapatches manifest"; unzip -p "$dp" META-INF/MANIFEST.MF
          echo "--- dregorapatches contents"; echo "$dpl"
          for c in vanilla nc levelup2; do
            grep -q "mixins.dregorapatches.$c.json" <<<"$dpl" || { echo "::error::mixins.dregorapatches.$c.json missing"; exit 1; }
          done
          grep -q 'FMLCorePlugin:io.github.tidefox.dregorapatches.core.DregoraPatchesPlugin' <<<"$dpm" \
            || { echo "::error::FMLCorePlugin missing"; exit 1; }
          # The refmap only exists once the early config lists mixins (the AP writes it per processed @Mixin).
          if unzip -p "$dp" mixins.dregorapatches.vanilla.json | python3 -c 'import json,sys; c=json.load(sys.stdin); sys.exit(0 if c.get("mixins") or c.get("server") else 1)'; then
            grep -q 'mixins.dregorapatches.refmap.json' <<<"$dpl" || { echo "::error::refmap missing"; exit 1; }
            echo "--- refmap"; unzip -p "$dp" mixins.dregorapatches.refmap.json
          fi
          if grep -qE ' (org/spongepowered|fermiumbooter|zone/rong|nc|levelup2)/' <<<"$dpl"; then
            echo "::error::dregorapatches must not bundle Mixin, FermiumBooter, MixinBooter or patched mods"; exit 1
          fi

          echo "--- warband contents"; echo "$wbl"
          if grep -qE 'org/spongepowered|mixins\..*\.json' <<<"$wbl"; then echo "::error::warband must not contain mixins"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: dist/*.jar
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            dregorapatches/build/reports/
            warband/build/reports/

  smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both CurseForge uploads of FermiumBooter 1.4.1: original and "(Fix)" re-upload.
        fermium_file_id: ['7212281', '7279112']
    name: smoke (FermiumBooter 1.4.1 file ${{ matrix.fermium_file_id }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Cache Forge server install
        id: cache-forge
        uses: actions/cache@v4
        with:
          path: smoke/server
          key: forge-server-${{ env.FORGE_VERSION }}-v1

      - name: Install Forge server
        if: steps.cache-forge.outputs.cache-hit != 'true'
        run: |
          mkdir -p smoke/server && cd smoke/server
          curl -fsSL --retry 4 -o installer.jar \
            "https://maven.minecraftforge.net/net/minecraftforge/forge/${FORGE_VERSION}/forge-${FORGE_VERSION}-installer.jar"
          # vanilla server jar (the old installer's download URL is not always reachable)
          curl -fsSL --retry 4 -o minecraft_server.1.12.2.jar \
            "https://piston-data.mojang.com/v1/objects/886945bfb2b978778c3a0288fd7fab09d315b25f/server.jar"
          java -jar installer.jar --installServer
          rm -f installer.jar installer.jar.log
          ls -la

      - name: Fetch FermiumBooter ${{ env.FERMIUM_VERSION }}
        run: ci/fetch-fermium.sh "${{ matrix.fermium_file_id }}" "$FERMIUM_VERSION" smoke/fermiumbooter.jar

      - uses: actions/download-artifact@v4
        with:
          name: jars
          path: smoke/dist

      - name: Boot server (both jar orders), /dpatch mixins, /wb reload, stop
        run: >
          ci/smoke.sh smoke/server
          "$(ls smoke/dist/dregorapatches-*.jar | head -1)"
          "$(ls smoke/dist/warband-*.jar | head -1)"
          smoke/fermiumbooter.jar

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logs-${{ matrix.fermium_file_id }}
          path: |
            smoke/server/console-*.log
            smoke/server/logs/
            smoke/server/crash-reports/
            smoke/server/config/dregorapatches.cfg
            smoke/server/config/warband.cfg
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jars
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
