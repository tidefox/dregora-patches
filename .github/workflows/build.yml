name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORGE_VERSION: 1.12.2-14.23.5.2860
  FERMIUM_VERSION: 1.4.1

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # Artifact name = release jar's base name, e.g. dregorapatches-0.2.0 (version from gradle.properties).
      artifact: ${{ steps.pick.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4

      # Java 8 is the compile/test toolchain; Gradle itself runs on 25, which
      # RetroFuturaGradle 2.x requires (last one listed = JAVA_HOME).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            25

      # Caches ~/.gradle, which includes RetroFuturaGradle's decompiled Minecraft/Forge and assets.
      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64

      - name: Pick and check release jar
        id: pick
        run: |
          set -euo pipefail
          mkdir -p dist
          dp=$(ls build/libs/dregorapatches-*.jar | grep -vE -- '-(dev|sources|javadoc)\.jar$' | head -1)
          [ -n "$dp" ] || { echo "::error::release jar missing"; exit 1; }
          cp "$dp" dist/
          echo "artifact=$(basename "$dp" .jar)" >> "$GITHUB_OUTPUT"

          # Listings are captured first: "unzip | grep -q" fails under pipefail when grep exits early (SIGPIPE).
          dpl=$(unzip -l "$dp"); dpm=$(unzip -p "$dp" META-INF/MANIFEST.MF | tr -d '\r\n ')
          echo "--- dregorapatches manifest"; unzip -p "$dp" META-INF/MANIFEST.MF
          echo "--- dregorapatches contents"; echo "$dpl"
          for c in vanilla nc levelup2 lycanites; do
            grep -q "mixins.dregorapatches.$c.json" <<<"$dpl" || { echo "::error::mixins.dregorapatches.$c.json missing"; exit 1; }
          done
          grep -q 'FMLCorePlugin:io.github.tidefox.dregorapatches.core.DregoraPatchesPlugin' <<<"$dpm" \
            || { echo "::error::FMLCorePlugin missing"; exit 1; }
          # The refmap only exists once the early config lists mixins (the AP writes it per processed @Mixin).
          if unzip -p "$dp" mixins.dregorapatches.vanilla.json | python3 -c 'import json,sys; c=json.load(sys.stdin); sys.exit(0 if c.get("mixins") or c.get("server") else 1)'; then
            grep -q 'mixins.dregorapatches.refmap.json' <<<"$dpl" || { echo "::error::refmap missing"; exit 1; }
            echo "--- refmap"; unzip -p "$dp" mixins.dregorapatches.refmap.json
          fi
          if grep -qE ' (org/spongepowered|fermiumbooter|zone/rong|nc|levelup2|com/lycanitesmobs)/' <<<"$dpl"; then
            echo "::error::dregorapatches must not bundle Mixin, FermiumBooter, MixinBooter or patched mods"; exit 1
          fi
          # Features must stay plain observers: mixin classes only under mixin/.
          if grep -E 'io/github/tidefox/dregorapatches/(trick|killfeed|combat|util)/' <<<"$dpl" | grep -qi mixin; then
            echo "::error::feature packages must not contain mixins"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pick.outputs.artifact }}
          path: dist/*.jar
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: build/reports/

  smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both CurseForge uploads of FermiumBooter 1.4.1: original and "(Fix)" re-upload.
        fermium_file_id: ['7212281', '7279112']
    name: smoke (FermiumBooter 1.4.1 file ${{ matrix.fermium_file_id }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Cache Forge server install
        id: cache-forge
        uses: actions/cache@v4
        with:
          path: smoke/server
          key: forge-server-${{ env.FORGE_VERSION }}-v1

      - name: Install Forge server
        if: steps.cache-forge.outputs.cache-hit != 'true'
        run: |
          mkdir -p smoke/server && cd smoke/server
          curl -fsSL --retry 4 -o installer.jar \
            "https://maven.minecraftforge.net/net/minecraftforge/forge/${FORGE_VERSION}/forge-${FORGE_VERSION}-installer.jar"
          # vanilla server jar (the old installer's download URL is not always reachable)
          curl -fsSL --retry 4 -o minecraft_server.1.12.2.jar \
            "https://piston-data.mojang.com/v1/objects/886945bfb2b978778c3a0288fd7fab09d315b25f/server.jar"
          java -jar installer.jar --installServer
          rm -f installer.jar installer.jar.log
          ls -la

      - name: Fetch FermiumBooter ${{ env.FERMIUM_VERSION }}
        run: ci/fetch-fermium.sh "${{ matrix.fermium_file_id }}" "$FERMIUM_VERSION" smoke/fermiumbooter.jar

      # The server's exact jars (sha1-checked), so the late NC / Level Up! 2 mixins are applied too.
      - name: Fetch NuclearCraft 2.19a, Level Up! 2 1.1.23 and Lycanites Mobs 2.0.8.10
        run: |
          ci/fetch-mod.sh nuclearcraft 226254 6151363 05db28e36a141316f8fa511f226c794110e58d12 smoke/nuclearcraft-1.12.2-2.19a.jar
          ci/fetch-mod.sh levelup2 251136 2763516 e41da79233cb9e37824cb05e9a5db7588bec599d smoke/levelup2-1.1.23-1.12.jar
          ci/fetch-mod.sh lycanitesmobs 224770 5750564 56c49cf01d62ee0715cc38b7d784165bcc1339d0 smoke/lycanitesmobs-1.12.2-2.0.8.10.jar

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: smoke/dist

      - name: Boot server (both jar orders + without patched mods), /dpatch, /reactor, /trickshots, stop
        run: >
          ci/smoke.sh smoke/server
          "$(ls smoke/dist/dregorapatches-*.jar | head -1)"
          smoke/fermiumbooter.jar
          smoke/nuclearcraft-1.12.2-2.19a.jar
          smoke/levelup2-1.1.23-1.12.jar
          smoke/lycanitesmobs-1.12.2-2.0.8.10.jar

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logs-${{ matrix.fermium_file_id }}
          path: |
            smoke/server/console-*.log
            smoke/server/logs/
            smoke/server/crash-reports/
            smoke/server/config/dregorapatches.cfg
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
